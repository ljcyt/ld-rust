name: Build and Release macOS

on:
  push:
    branches:
      - main
  workflow_dispatch: # 支持手动触发

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin, aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        # 核心：必须使用 --legacy-peer-deps 解决 React 19 冲突
        run: npm install --legacy-peer-deps

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # 自动从 package.json 获取版本号
          releaseName: "卤蛋侠工单系统 v__VERSION__"
          releaseBody: "自动生成的 macOS 构建版本。"
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin # 构建同时支持 Intel 和 Apple Silicon 的通用二进制文件

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-artifacts
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
